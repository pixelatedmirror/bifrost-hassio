# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bifrost Dev
version: dev-2026-10-14.2
slug: bifrost-dev
description: "Bifrost enables you to emulate a Philips Hue Bridge to control lights, groups and scenes from Zigbee2Mqtt."
url: "https://github.com/duvholt/bifrost/tree/dev"
arch:
  - amd64
  - aarch64
init: false

## Map config into container (writable)
map:
  - config:rw

## needed to bind to port 80 and 443
privileged:
  - NET_ADMIN

## needed to access the mac address of the physical interface

host_network: true

apparmor: false

schema:
  bridge:
    name: str
    mac: str
    ipaddress: str
    netmask: "str?"
    gateway: "str?"
    timezone: "str?"
    bind_ipaddress: "str?"
    http_port: "port?"
    https_port: "port?"
    entm_port: "port?"
  bifrost:
    cert_file: "str?"
    state_file: "str?"
  z2m_servers:
    - name: str
      url: url
      group_prefix: "str?"
      disable_tls_verify: "bool?"
      streaming_fps: "int(1,60)?"

options:
  bridge:
    name: "Bifrost"
    mac: "00:11:22:33:44:55"
    ipaddress: "10.12.0.20"
    netmask: "255.255.255.0"
    gateway: "10.12.0.1"
    timezone: "Europe/Copenhagen"
    http_port: 80
    https_port: 443
    entm_port: 2100
  bifrost:
    cert_file: "cert.pem"
    state_file: "state.yaml"
  z2m_servers:
    - name: "server1"
      url: "ws://10.0.0.100:8080"
